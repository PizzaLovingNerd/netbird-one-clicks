---
services:
  netbird-config:
    image: "${NETBIRD_CONFIG_INIT_IMAGE:-alpine:3.22.5}"
    container_name: netbird-config
    restart: "no"
    environment:
      NETBIRD_FQDN: "${NETBIRD_FQDN:?Set NETBIRD_FQDN to the public hostname}"
    volumes:
      - netbird_config:/config
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if [ -s /config/config.yaml ]; then
          echo "Existing NetBird configuration retained."
          exit 0
        fi
        umask 077
        relay_secret="$$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
        datastore_key="$$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
        config_tmp="/config/config.yaml.tmp"
        cat >"$${config_tmp}" <<EOF
        server:
          listenAddress: ":80"
          exposedAddress: "https://$${NETBIRD_FQDN}:443"
          stunPorts:
            - 3478
          metricsPort: 9090
          healthcheckAddress: ":9000"
          logLevel: "info"
          logFile: "console"
          authSecret: "$${relay_secret}"
          dataDir: "/var/lib/netbird"
          auth:
            issuer: "https://$${NETBIRD_FQDN}/oauth2"
            signKeyRefreshEnabled: true
            dashboardRedirectURIs:
              - "https://$${NETBIRD_FQDN}/nb-auth"
              - "https://$${NETBIRD_FQDN}/nb-silent-auth"
            cliRedirectURIs:
              - "http://localhost:53000/"
          reverseProxy:
            trustedHTTPProxies:
              - "172.30.0.10/32"
            trustedPeers:
              - "172.30.0.10/32"
          store:
            engine: "sqlite"
            encryptionKey: "$${datastore_key}"
        EOF
        mv "$${config_tmp}" /config/config.yaml
        chmod 0600 /config/config.yaml
    healthcheck:
      test: ["CMD", "test", "-s", "/config/config.yaml"]
      interval: 2s
      timeout: 2s
      retries: 5

  traefik:
    image: "${NETBIRD_TRAEFIK_IMAGE:-traefik:v3.7.10}"
    container_name: netbird-traefik
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.10
    command:
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=netbird
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.allowACMEByPass=true
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - "--certificatesresolvers.letsencrypt.acme.email=${NETBIRD_ACME_EMAIL:?Set NETBIRD_ACME_EMAIL}"
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --serverstransport.forwardingtimeouts.responseheadertimeout=0s
      - --serverstransport.forwardingtimeouts.idleconntimeout=0s
    ports:
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netbird_traefik_letsencrypt:/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "3"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  dashboard:
    image: "${NETBIRD_DASHBOARD_IMAGE:-netbirdio/dashboard:v2.90.8}"
    container_name: netbird-dashboard
    restart: unless-stopped
    networks:
      - netbird
    environment:
      NETBIRD_MGMT_API_ENDPOINT: "https://${NETBIRD_FQDN}"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://${NETBIRD_FQDN}"
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_CLIENT_SECRET: ""
      AUTH_AUTHORITY: "https://${NETBIRD_FQDN}/oauth2"
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: none
    labels:
      - traefik.enable=true
      - "traefik.http.routers.netbird-dashboard.rule=Host(`${NETBIRD_FQDN}`)"
      - traefik.http.routers.netbird-dashboard.entrypoints=websecure
      - traefik.http.routers.netbird-dashboard.tls=true
      - traefik.http.routers.netbird-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-dashboard.service=dashboard
      - traefik.http.routers.netbird-dashboard.priority=1
      - traefik.http.services.dashboard.loadbalancer.server.port=80
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  netbird-server:
    image: "${NETBIRD_SERVER_IMAGE:-netbirdio/netbird-server:0.76.0}"
    container_name: netbird-server
    restart: unless-stopped
    depends_on:
      netbird-config:
        condition: service_completed_successfully
    networks:
      - netbird
    ports:
      - "0.0.0.0:3478:3478/udp"
    volumes:
      - netbird_data:/var/lib/netbird
      - netbird_config:/etc/netbird:ro
    command:
      - --config
      - /etc/netbird/config.yaml
    labels:
      - traefik.enable=true
      - >-
        traefik.http.routers.netbird-grpc.rule=Host(`${NETBIRD_FQDN}`)
        && (PathPrefix(`/signalexchange.SignalExchange/`)
        || PathPrefix(`/management.ManagementService/`)
        || PathPrefix(`/management.ProxyService/`))
      - traefik.http.routers.netbird-grpc.entrypoints=websecure
      - traefik.http.routers.netbird-grpc.tls=true
      - traefik.http.routers.netbird-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-grpc.service=netbird-server-h2c
      - traefik.http.routers.netbird-grpc.priority=100
      - >-
        traefik.http.routers.netbird-backend.rule=Host(`${NETBIRD_FQDN}`)
        && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`)
        || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.netbird-backend.entrypoints=websecure
      - traefik.http.routers.netbird-backend.tls=true
      - traefik.http.routers.netbird-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-backend.service=netbird-server
      - traefik.http.routers.netbird-backend.priority=100
      - traefik.http.services.netbird-server.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.scheme=h2c
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "3"
    healthcheck:
      # Keep startup health local: Traefik only routes to healthy containers,
      # while NetBird's :9000 check verifies the public /relay route.
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  netbird_config:
  netbird_data:
  netbird_traefik_letsencrypt:

networks:
  netbird:
    name: netbird
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: netbird0
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
