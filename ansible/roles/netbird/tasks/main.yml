---
- name: Create NetBird project directory
  ansible.builtin.file:
    path: "{{ netbird_project_dir }}"
    state: directory
    owner: root
    group: "{{ netbird_admin_user }}"
    mode: "0750"

- name: Install canonical Docker Compose model
  ansible.builtin.copy:
    src: "{{ netbird_compose_source }}"
    remote_src: true
    dest: "{{ netbird_project_dir }}/docker-compose.yml"
    owner: root
    group: "{{ netbird_admin_user }}"
    mode: "0640"

- name: Install NetBird deployment environment
  ansible.builtin.template:
    src: deployment.env.j2
    dest: "{{ netbird_project_dir }}/.env"
    owner: root
    group: "{{ netbird_admin_user }}"
    mode: "0640"

- name: Validate Docker Compose model
  ansible.builtin.command: docker compose config --quiet
  args:
    chdir: "{{ netbird_project_dir }}"
  changed_when: false

- name: Pull NetBird images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ netbird_project_dir }}"
  register: netbird_compose_pull
  retries: 3
  delay: 10
  until: netbird_compose_pull.rc == 0
  changed_when: true

- name: Start NetBird
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ netbird_project_dir }}"
  register: netbird_compose_up
  changed_when: >-
    'Started' in netbird_compose_up.stderr
    or 'Created' in netbird_compose_up.stderr
    or 'Recreated' in netbird_compose_up.stderr

- name: Wait for all long-running containers to become healthy
  ansible.builtin.command: >-
    docker compose ps --format json
  args:
    chdir: "{{ netbird_project_dir }}"
  register: netbird_compose_status
  changed_when: false
  retries: 60
  delay: 5
  until:
    - netbird_compose_status.rc == 0
    - netbird_compose_status.stdout is search('"Service":"traefik"')
    - netbird_compose_status.stdout is search('"Service":"dashboard"')
    - netbird_compose_status.stdout is search('"Service":"netbird-server"')
    - netbird_compose_status.stdout
      | regex_findall('"Health":"healthy"') | length >= 3
