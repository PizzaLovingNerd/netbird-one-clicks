---
- name: Select Docker apt architecture
  ansible.builtin.set_fact:
    host_docker_apt_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}

- name: Update apt package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install host dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - dnsutils
      - fail2ban
      - gnupg
      - iptables
      - openssh-client
      - openssh-server
      - openssl
      - python3-debian
      - unattended-upgrades
      - ufw
    state: present

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: host_docker_signing_key
  retries: 3
  delay: 5
  until: host_docker_signing_key is succeeded

- name: Configure Docker stable repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts.distribution_release }}"
    components: [stable]
    architectures:
      - "{{ host_docker_apt_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Verify Docker Compose
  ansible.builtin.command: docker compose version
  changed_when: false
