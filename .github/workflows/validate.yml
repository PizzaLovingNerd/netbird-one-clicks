---
name: Validate marketplace artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: 1.16.0
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --break-system-packages -r requirements-dev.txt
      - name: Validate
        run: make validate
      - name: Build release artifacts
        run: ./scripts/build-artifacts.sh --skip-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netbird-one-clicks-release-artifacts
          path: build/releases/v*/
          if-no-files-found: error
