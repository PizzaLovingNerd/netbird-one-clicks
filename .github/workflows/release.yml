---
name: Build draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: 1.16.0
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --break-system-packages -r requirements-dev.txt
      - name: Verify tag and build artifacts
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          make artifacts
          sha256sum --check "build/releases/${GITHUB_REF_NAME}/SHA256SUMS"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/releases/${GITHUB_REF_NAME}"/* \
            --draft \
            --generate-notes \
            --title "NetBird One-Clicks ${GITHUB_REF_NAME}" \
            --verify-tag
